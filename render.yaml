services:
  - type: web
    name: cost-review-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
      startCommand: alembic upgrade head && python scripts/seed_sample.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cost-review-db
          property: connectionString
      - key: AUTH_REQUIRED
        value: "true"
      - key: CORS_ORIGINS
        value: https://cost-review-mvp.vercel.app
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: EXPORT_DIR
        value: /tmp/exports
      - key: PREPROCESSING_DIR
        value: /tmp/preprocessing
      - key: PRICE_API_SERVICE_NAME
        value: PriceInfoService
      - key: MVP_CONSTRUCTION_PASSWORD
        sync: false
      - key: MVP_DESIGN_PASSWORD
        sync: false
      - key: MVP_PROCUREMENT_PASSWORD
        sync: false
      - key: MVP_MASTER_PASSWORD
        sync: false
      - key: PRICE_API_URL
        sync: false
      - key: PRICE_API_KEY
        sync: false
      - key: PUBLIC_DATA_SERVICE_KEY
        sync: false

databases:
  - name: cost-review-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: cost_review
    user: cost_review
